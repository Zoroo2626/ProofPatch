name: Feature request
description: Suggest a scoped improvement to ProofPatch.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the problem or workflow gap without prescribing an implementation.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe the observable behavior that would address the problem.
    validations:
      required: true
  - type: textarea
    id: security
    attributes:
      label: Security-boundary impact
      description: Note any effect on trust labels, mounts, credentials, evidence, or verification.
